name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    # 23 minutes past every third hour. GitHub delays, and sometimes drops, scheduled runs
    # at the start of the hour, so this avoids :00.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 build.py
      - name: Keep-alive record
        run: |
          ls _site/episodes > episodes.txt
          # Year and month only: the first run of each month changes it, so it commits once a month.
          date -u +%Y-%m > last-checkin.txt
          git config user.name "mess-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add episodes.txt last-checkin.txt 2>/dev/null || git add episodes.txt
          if ! git diff --cached --quiet; then git commit -m "Update episode list [skip ci]"; git push || echo "push skipped"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
